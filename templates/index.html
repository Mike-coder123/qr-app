<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 0.95rem; margin-bottom: 30px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; margin-bottom: 20px; transition: border 0.2s;
    }
    input[type="text"]:focus { outline: none; border-color: #4f46e5; }
    .file-upload {
      border: 2px dashed #ddd; border-radius: 8px; padding: 20px;
      text-align: center; margin-bottom: 24px; cursor: pointer; transition: border 0.2s;
    }
    .file-upload:hover { border-color: #4f46e5; }
    .file-upload input { display: none; }
    .file-upload span { color: #888; font-size: 0.9rem; }
    .file-upload .filename { color: #4f46e5; font-weight: 600; font-size: 0.9rem; }
    button {
      width: 100%; padding: 12px; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QR Code Generator</h1>
    <p class="subtitle">Enter a URL and upload a logo to generate a branded QR code.</p>
    <form method="POST" enctype="multipart/form-data">
      <label for="data">Text or URL</label>
      <input type="text" id="data" name="data" placeholder="https://example.com" required>
      <label>Logo Image (PNG)</label>
      <div class="file-upload" onclick="document.getElementById('logo').click()">
        <input type="file" id="logo" name="logo" accept=".png,image/*" required
               onchange="document.getElementById('fname').textContent = this.files[0].name">
        <span id="fname">Click to choose a file...</span>
      </div>
      <button type="submit">Generate QR Code</button>
    </form>
  </div>
</body>
</html>
